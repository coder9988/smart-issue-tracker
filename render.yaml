databases:
  - name: smart-issue-tracker-db
    plan: free
    databaseName: smart_issue_tracker
    user: tracker_user

services:
  - type: web
    name: smart-issue-tracker-backend
    runtime: docker
    plan: free
    rootDir: backend
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://smart-issue-tracker-frontend.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://smart-issue-tracker-backend.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: smart-issue-tracker-db
          property: connectionString

  - type: web
    name: smart-issue-tracker-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://smart-issue-tracker-backend.onrender.com/api/"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
